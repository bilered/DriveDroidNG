name: Build PocketBoot APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK 35
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Bundle Static ARM64 Tools (7zzs, NTFS, exFAT, ms-sys, Ventoy, Windows ISO Builder)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets

          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu autoconf automake libtool pkg-config libgcrypt20-dev gettext autopoint file cmake patch

          # 1. Official Rufus UEFI:NTFS boot partition image
          curl -fSL "https://raw.githubusercontent.com/pbatard/rufus/master/res/uefi/uefi-ntfs.img" -o app/src/main/assets/uefi-ntfs.img

          # 2. Official static ARM64 7-Zip (7zzs)
          curl -fSL "https://github.com/ip7z/7zip/releases/download/26.06/7z2606-linux-arm64.tar.xz" -o /tmp/7z-arm64.tar.xz || \
            curl -fSL "https://github.com/ip7z/7zip/releases/download/25.01/7z2501-linux-arm64.tar.xz" -o /tmp/7z-arm64.tar.xz
          tar -xf /tmp/7z-arm64.tar.xz -C /tmp 7zzs
          cp /tmp/7zzs app/src/main/jniLibs/arm64-v8a/lib7zzs.so
          chmod 755 app/src/main/jniLibs/arm64-v8a/lib7zzs.so

          # 3. Cross-compile STATIC ARM64 mkntfs + ntfs-3g FUSE (tuxera/ntfs-3g) -> libmkfs_ntfs.so & libntfs_3g.so
          (
            set -e
            git clone --depth 1 --branch 2026.9.28 https://github.com/tuxera/ntfs-3g.git /tmp/ntfs-3g || \
              git clone --depth 1 https://github.com/tuxera/ntfs-3g.git /tmp/ntfs-3g
            cd /tmp/ntfs-3g
            mkdir -p m4
            if ! grep -rq "PKG_CHECK_MODULES" /usr/share/aclocal /usr/share/aclocal-* m4 2>/dev/null; then
              printf '%s\n' 'AC_DEFUN([PKG_PROG_PKG_CONFIG], [])' 'AC_DEFUN([PKG_CHECK_MODULES], [$4])' >> m4/zz_ci_stubs.m4
            fi
            if ! grep -rq "AM_PATH_LIBGCRYPT" /usr/share/aclocal /usr/share/aclocal-* m4 2>/dev/null; then
              printf '%s\n' 'AC_DEFUN([AM_PATH_LIBGCRYPT], [$3])' >> m4/zz_ci_stubs.m4
            fi
            ./autogen.sh
            ac_cv_func_malloc_0_nonnull=yes ac_cv_func_realloc_0_nonnull=yes \
              ./configure --host=aarch64-linux-gnu --enable-static --disable-shared \
              --with-fuse=internal --disable-mtab --disable-ldconfig \
              --disable-crypto --disable-quarantined \
              --disable-posix-acls --disable-xattr-mappings --without-uuid CFLAGS="-O2"
            make -j"$(nproc)" -C libntfs-3g
            make -j"$(nproc)" -C libfuse-lite
            make -j"$(nproc)" -C ntfsprogs mkntfs LDFLAGS="-all-static"
            make -j"$(nproc)" -C ntfsprogs ntfsresize LDFLAGS="-all-static" || true
            make -j"$(nproc)" -C src ntfs-3g LDFLAGS="-all-static"

            MKNTFS_BIN="ntfsprogs/mkntfs"
            [ -f "ntfsprogs/.libs/mkntfs" ] && MKNTFS_BIN="ntfsprogs/.libs/mkntfs"
            if aarch64-linux-gnu-readelf -l "$MKNTFS_BIN" 2>/dev/null | grep -q INTERP; then
              echo "Libtool linked mkntfs dynamically; re-linking directly with -static..."
              LIBNTFS=$(find libntfs-3g -name 'libntfs-3g.a' | head -n 1)
              OBJS=$(find ntfsprogs -maxdepth 1 -name 'mkntfs-*.o' -o -name 'mkntfs.o' -o -name 'attrdef.o' -o -name 'boot.o' -o -name 'sd.o' -o -name 'utils.o')
              aarch64-linux-gnu-gcc -static -O2 $OBJS "$LIBNTFS" -lpthread -lm -o /tmp/mkntfs-static
              MKNTFS_BIN="/tmp/mkntfs-static"
            fi
            file "$MKNTFS_BIN"
            if ! aarch64-linux-gnu-readelf -l "$MKNTFS_BIN" 2>/dev/null | grep -q INTERP; then
              aarch64-linux-gnu-strip "$MKNTFS_BIN"
              cp "$MKNTFS_BIN" "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libmkfs_ntfs.so"
              chmod 755 "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libmkfs_ntfs.so"
            fi

            NTFS3G_BIN="src/ntfs-3g"
            [ -f "src/.libs/ntfs-3g" ] && NTFS3G_BIN="src/.libs/ntfs-3g"
            if aarch64-linux-gnu-readelf -l "$NTFS3G_BIN" 2>/dev/null | grep -q INTERP; then
              echo "Libtool linked ntfs-3g dynamically; re-linking directly with -static..."
              LIBNTFS=$(find libntfs-3g -name 'libntfs-3g.a' | head -n 1)
              LIBFUSE=$(find libfuse-lite -name 'libfuse-lite.a' | head -n 1)
              OBJS=$(find src -maxdepth 1 -name 'ntfs_3g-*.o')
              aarch64-linux-gnu-gcc -static -O2 $OBJS "$LIBNTFS" "$LIBFUSE" -lpthread -lm -o /tmp/ntfs-3g-static
              NTFS3G_BIN="/tmp/ntfs-3g-static"
            fi
            file "$NTFS3G_BIN"
            if ! aarch64-linux-gnu-readelf -l "$NTFS3G_BIN" 2>/dev/null | grep -q INTERP; then
              aarch64-linux-gnu-strip "$NTFS3G_BIN"
              cp "$NTFS3G_BIN" "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libntfs_3g.so"
              chmod 755 "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libntfs_3g.so"
            fi

            NTFSRESIZE_BIN="ntfsprogs/ntfsresize"
            [ -f "ntfsprogs/.libs/ntfsresize" ] && NTFSRESIZE_BIN="ntfsprogs/.libs/ntfsresize"
            if [ -f "$NTFSRESIZE_BIN" ]; then
              if aarch64-linux-gnu-readelf -l "$NTFSRESIZE_BIN" 2>/dev/null | grep -q INTERP; then
                LIBNTFS=$(find libntfs-3g -name 'libntfs-3g.a' | head -n 1)
                ROBJS=$(find ntfsprogs -maxdepth 1 -name 'ntfsresize*.o' -o -name 'utils.o')
                aarch64-linux-gnu-gcc -static -O2 $ROBJS "$LIBNTFS" -lpthread -lm -o /tmp/ntfsresize-static || true
                [ -f /tmp/ntfsresize-static ] && NTFSRESIZE_BIN="/tmp/ntfsresize-static"
              fi
              if ! aarch64-linux-gnu-readelf -l "$NTFSRESIZE_BIN" 2>/dev/null | grep -q INTERP; then
                aarch64-linux-gnu-strip "$NTFSRESIZE_BIN"
                cp "$NTFSRESIZE_BIN" "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libntfsresize.so"
                chmod 755 "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libntfsresize.so"
              fi
            fi
          ) || echo "::warning::Could not bundle static ntfs-3g tools"

          # 4. Cross-compile STATIC ARM64 ms-sys (pbatard/ms-sys or SourceForge 2.8.0) -> libms_sys.so
          (
            set -e
            git clone --depth 1 https://github.com/pbatard/ms-sys.git /tmp/ms-sys || (
              curl -fSL "https://downloads.sourceforge.net/project/ms-sys/ms-sys%20stable/2.8.0/ms-sys-2.8.0.tar.gz" -o /tmp/ms-sys.tar.gz &&
              mkdir -p /tmp/ms-sys && tar -xzf /tmp/ms-sys.tar.gz --strip-components=1 -C /tmp/ms-sys
            )
            cd /tmp/ms-sys
            mkdir -p bin
            aarch64-linux-gnu-gcc -static -O2 -Iinc -idirafter include-fallback \
              -D_FILE_OFFSET_BITS=64 -DPACKAGE=\"ms-sys\" -DLOCALEDIR=\"/usr/share/locale\" \
              src/*.c -o bin/ms-sys

            file bin/ms-sys
            if aarch64-linux-gnu-readelf -l bin/ms-sys 2>/dev/null | grep -q INTERP; then
              echo "::warning::ms-sys still has PT_INTERP; skipping bundle"
              exit 1
            fi

            aarch64-linux-gnu-strip bin/ms-sys
            cp bin/ms-sys "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libms_sys.so"
            chmod 755 "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libms_sys.so"
          ) || echo "::warning::Could not bundle static ms-sys; MBR Legacy BIOS VBR patching will use fallback"

          # 5. Cross-compile STATIC ARM64 mkfs.exfat (exfatprogs) -> libmkfs_exfat.so
          (
            set -e
            git clone --depth 1 --branch 1.2.9 https://github.com/exfatprogs/exfatprogs.git /tmp/exfatprogs || \
              git clone --depth 1 https://github.com/exfatprogs/exfatprogs.git /tmp/exfatprogs
            cd /tmp/exfatprogs
            ./autogen.sh
            ac_cv_func_malloc_0_nonnull=yes ac_cv_func_realloc_0_nonnull=yes \
              ./configure --host=aarch64-linux-gnu --enable-static --disable-shared CFLAGS="-O2"
            make -j"$(nproc)" -C lib
            make -j"$(nproc)" -C mkfs LDFLAGS="-all-static"

            if aarch64-linux-gnu-readelf -l mkfs/mkfs.exfat 2>/dev/null | grep -q INTERP; then
              LIBEXFAT=$(find lib -name 'libexfat.a' | head -n 1)
              aarch64-linux-gnu-gcc -static -O2 mkfs/*.o "$LIBEXFAT" -o mkfs/mkfs.exfat
            fi

            file mkfs/mkfs.exfat
            if aarch64-linux-gnu-readelf -l mkfs/mkfs.exfat 2>/dev/null | grep -q INTERP; then
              echo "::warning::mkfs.exfat still has PT_INTERP; skipping bundle"
              exit 1
            fi

            aarch64-linux-gnu-strip mkfs/mkfs.exfat
            cp mkfs/mkfs.exfat "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libmkfs_exfat.so"
            chmod 755 "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libmkfs_exfat.so"
          ) || echo "::warning::Could not bundle static mkfs.exfat"

          # 5b. Cross-compile STATIC ARM64 mkfs.fat (dosfstools) -> libmkfs_fat.so (Linux/Tool FAT32 USB Builder)
          (
            set -e
            curl -fSL "https://github.com/dosfstools/dosfstools/releases/download/v4.2/dosfstools-4.2.tar.gz" -o /tmp/dosfstools.tar.gz
            mkdir -p /tmp/dosfstools-src
            tar -xzf /tmp/dosfstools.tar.gz --strip-components=1 -C /tmp/dosfstools-src
            cd /tmp/dosfstools-src
            ./configure --host=aarch64-linux-gnu --without-udev CFLAGS="-O2" LDFLAGS="-static"
            make -j"$(nproc)" -C src mkfs.fat
            if ! aarch64-linux-gnu-readelf -l src/mkfs.fat 2>/dev/null | grep -q INTERP; then
              aarch64-linux-gnu-strip src/mkfs.fat
              cp src/mkfs.fat "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libmkfs_fat.so"
              chmod 755 "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libmkfs_fat.so"
            fi
          ) || echo "::warning::Could not bundle static mkfs.fat"

          # 6. Bundle official Ventoy boot files (~10 MB) inside app/src/main/assets/ventoy/
          (
            set -e
            mkdir -p app/src/main/assets/ventoy /tmp/ventoy-dl
            VTAG=$(curl -fsSL -H "User-Agent: PocketBoot-CI" "https://api.github.com/repos/ventoy/Ventoy/releases/latest" | grep -oE '"tag_name":[[:space:]]*"v[^"]+"' | head -n 1 | sed -E 's/.*"v([^"]+)".*/\1/' || true)
            [ -z "$VTAG" ] && VTAG="1.1.18"
            echo "Bundling official Ventoy v${VTAG}..."
            curl -fSL "https://github.com/ventoy/Ventoy/releases/download/v${VTAG}/ventoy-${VTAG}-linux.tar.gz" -o /tmp/ventoy-dl/ventoy.tar.gz || {
              VTAG="1.1.18"
              curl -fSL "https://github.com/ventoy/Ventoy/releases/download/v1.1.18/ventoy-1.1.18-linux.tar.gz" -o /tmp/ventoy-dl/ventoy.tar.gz
            }
            tar -xzf /tmp/ventoy-dl/ventoy.tar.gz -C /tmp/ventoy-dl
            VDIR=$(find /tmp/ventoy-dl -mindepth 1 -maxdepth 1 -type d -name 'ventoy-*' | head -n 1)
            cp "$VDIR/boot/boot.img" app/src/main/assets/ventoy/boot.img
            cp "$VDIR/boot/core.img.xz" app/src/main/assets/ventoy/core.img.xz
            cp "$VDIR/ventoy/ventoy.disk.img.xz" app/src/main/assets/ventoy/ventoy.disk.img.xz
            printf '%s' "$VTAG" > app/src/main/assets/ventoy/version.txt
            ls -lh app/src/main/assets/ventoy/
          ) || echo "::warning::Could not bundle Ventoy boot files; users can download them in-app"

          # 7. Cross-compile minimal STATIC ARM64 libxml2 + wimlib-imagex -> libwimlib_imagex.so (ISO Slimmer & Edition Inspector)
          (
            set -e
            SYSROOT="/tmp/arm64-sysroot"
            mkdir -p "$SYSROOT" /tmp/libxml2-src /tmp/wimlib-src

            git clone --depth 1 --branch v2.13.5 https://gitlab.gnome.org/GNOME/libxml2.git /tmp/libxml2-src || \
              git clone --depth 1 https://github.com/GNOME/libxml2.git /tmp/libxml2-src
            cd /tmp/libxml2-src
            NOCONFIGURE=1 ./autogen.sh
            ac_cv_func_malloc_0_nonnull=yes ac_cv_func_realloc_0_nonnull=yes \
              ./configure --host=aarch64-linux-gnu --prefix="$SYSROOT" \
              --enable-static --disable-shared \
              --without-python --without-zlib --without-lzma --without-iconv --without-icu \
              --without-http --without-ftp --without-catalog --without-debug CFLAGS="-O2"
            make -j"$(nproc)" install

            curl -fSL "https://wimlib.net/downloads/wimlib-1.14.4.tar.gz" -o /tmp/wimlib.tar.gz || \
              curl -fSL "https://wimlib.net/downloads/wimlib-1.14.5.tar.gz" -o /tmp/wimlib.tar.gz
            tar -xzf /tmp/wimlib.tar.gz --strip-components=1 -C /tmp/wimlib-src
            cd /tmp/wimlib-src
            ac_cv_func_malloc_0_nonnull=yes ac_cv_func_realloc_0_nonnull=yes \
              PKG_CONFIG_PATH="$SYSROOT/lib/pkgconfig" \
              LIBXML2_CFLAGS="-I$SYSROOT/include/libxml2" \
              LIBXML2_LIBS="-L$SYSROOT/lib -lxml2 -lm" \
              ./configure --host=aarch64-linux-gnu --enable-static --disable-shared \
              --without-fuse --without-ntfs-3g --without-libcrypto \
              --disable-ssse3-sha1 --disable-avx-sha1 CFLAGS="-O2"
            make -j"$(nproc)" libwim.la
            make -j"$(nproc)" wimlib-imagex LDFLAGS="-all-static"

            WIM_BIN="wimlib-imagex"
            [ -f ".libs/wimlib-imagex" ] && WIM_BIN=".libs/wimlib-imagex"
            if aarch64-linux-gnu-readelf -l "$WIM_BIN" 2>/dev/null | grep -q INTERP; then
              echo "Libtool linked wimlib-imagex dynamically; re-linking directly with -static..."
              LIBWIM=$(find . -name 'libwim.a' | head -n 1)
              OBJS=$(find programs -name '*.o' | grep -v 'test')
              aarch64-linux-gnu-gcc -static -O2 $OBJS "$LIBWIM" "$SYSROOT/lib/libxml2.a" -lpthread -lm -o /tmp/wimlib-imagex-static
              WIM_BIN="/tmp/wimlib-imagex-static"
            fi
            file "$WIM_BIN"
            if ! aarch64-linux-gnu-readelf -l "$WIM_BIN" 2>/dev/null | grep -q INTERP; then
              aarch64-linux-gnu-strip "$WIM_BIN"
              cp "$WIM_BIN" "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libwimlib_imagex.so"
              chmod 755 "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libwimlib_imagex.so"
            fi
          ) || echo "::warning::Could not bundle static wimlib-imagex"

          # 8. Cross-compile STATIC ARM64 GNU xorriso -> libxorriso.so (UEFI+BIOS bootable ISO creator)
          (
            set -e
            curl -fSL "https://ftp.gnu.org/gnu/xorriso/xorriso-1.5.6.pl02.tar.gz" -o /tmp/xorriso.tar.gz || \
              curl -fSL "https://mirror.eu.ossplanet.net/gnu/xorriso/xorriso-1.5.6.pl02.tar.gz" -o /tmp/xorriso.tar.gz
            mkdir -p /tmp/xorriso-src
            tar -xzf /tmp/xorriso.tar.gz --strip-components=1 -C /tmp/xorriso-src
            cd /tmp/xorriso-src
            ac_cv_func_malloc_0_nonnull=yes ac_cv_func_realloc_0_nonnull=yes \
              ./configure --host=aarch64-linux-gnu --enable-static --disable-shared \
              --disable-libacl --disable-xattr --disable-zlib --disable-libbz2 --disable-libreadline \
              CFLAGS="-O2 -std=gnu17" LDFLAGS="-static"
            make -j"$(nproc)" LDFLAGS="-all-static"
            XOR_BIN="xorriso/xorriso"
            [ -f "xorriso/.libs/xorriso" ] && XOR_BIN="xorriso/.libs/xorriso"
            if aarch64-linux-gnu-readelf -l "$XOR_BIN" 2>/dev/null | grep -q INTERP; then
              echo "Libtool linked xorriso dynamically; re-linking directly with -static..."
              XOBJS=$(find xorriso libisoburn libisofs libjte libburn -name 'xorriso_xorriso-*.o')
              aarch64-linux-gnu-gcc -static -O2 $XOBJS -lpthread -lm -o /tmp/xorriso-static
              XOR_BIN="/tmp/xorriso-static"
            fi
            file "$XOR_BIN"
            if ! aarch64-linux-gnu-readelf -l "$XOR_BIN" 2>/dev/null | grep -q INTERP; then
              aarch64-linux-gnu-strip "$XOR_BIN"
              cp "$XOR_BIN" "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libxorriso.so"
              chmod 755 "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libxorriso.so"
            fi
          ) || echo "::warning::Could not bundle static xorriso"

          # 11. Smoke-test bundled static ARM64 xorriso + 7zzs under qemu-aarch64 (verifies zero 0-byte corruption!)
          (
            set -e
            test -x "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libxorriso.so"
            test -x "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/lib7zzs.so"
            sudo apt-get install -y -qq qemu-user >/dev/null 2>&1 || true
            QEMU_BIN=$(command -v qemu-aarch64 || command -v qemu-aarch64-static || echo "")
            if [ -n "$QEMU_BIN" ]; then
              TDIR="/tmp/pb_xor_smoke"
              rm -rf "$TDIR" /tmp/pb_xor_smoke.iso
              mkdir -p "$TDIR/boot" "$TDIR/efi/microsoft/boot" "$TDIR/sources/\$OEM\$/\$\$/Setup/Scripts" "$TDIR/support/logging/en-us"
              dd if=/dev/zero of="$TDIR/boot/etfsboot.com" bs=512 count=8 status=none
              dd if=/dev/zero of="$TDIR/efi/microsoft/boot/efisys.bin" bs=1024 count=16 status=none
              printf 'WIM_HEADER_TEST_DATA\n' > "$TDIR/sources/install.wim"
              printf '@echo off\r\necho ok\r\n' > "$TDIR/sources/\$OEM\$/\$\$/Setup/Scripts/PocketBoot_Specialize.cmd"
              printf 'ETW_MANIFEST_DATA\n' > "$TDIR/support/logging/en-us/actionqueueetw.dll.mui"
              (
                cd "$TDIR"
                "$QEMU_BIN" "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libxorriso.so" -as mkisofs                   --stdio_sync 16m -iso-level 3 -full-iso9660-filenames -J -joliet-long -c boot/boot.cat                   -volid "PB_XOR_TEST"                   -b "boot/etfsboot.com" -no-emul-boot -boot-load-size 8                   -eltorito-alt-boot -e "efi/microsoft/boot/efisys.bin" -no-emul-boot                   -o /tmp/pb_xor_smoke.iso .
              )
              file /tmp/pb_xor_smoke.iso
              "$QEMU_BIN" "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/lib7zzs.so" l -slt /tmp/pb_xor_smoke.iso | awk '
                BEGIN { path=""; folder=""; sz=-1; files=0; zeros=0; seen=0 }
                function flush_rec() {
                  if (!seen) return
                  if (folder != "+") {
                    lp = tolower(path)
                    if (lp !~ /(^|[\/\\])boot\.cat(alog)?$/ && lp !~ /^\[boot\]/) {
                      files++
                      if (sz == 0) zeros++
                    }
                  }
                  path=""; folder=""; sz=-1; seen=0
                }
                /^Path = / { flush_rec(); path=substr($0, 8); seen=1; next }
                /^Folder = / { folder=substr($0, 10); next }
                /^Size = / { sz=substr($0, 8)+0; next }
                /^$/ { flush_rec(); next }
                END {
                  flush_rec()
                  printf "XOR_SMOKE|files=%d|zeros=%d\n", files, zeros
                  if (files < 5 || zeros > 0) exit 1
                }
              '
              rm -rf "$TDIR" /tmp/pb_xor_smoke.iso
            fi
          )

          ls -lh app/src/main/assets/uefi-ntfs.img app/src/main/jniLibs/arm64-v8a/
          file app/src/main/jniLibs/arm64-v8a/*.so

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketBoot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
